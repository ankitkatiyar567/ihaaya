<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ec">
<title>Ihanaa's Star Chart</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fff8ec; --bg2:#ffedd0; --card:#ffffff; --ink:#2d2350; --muted:#6c6488; --line:#efe3cd;
  --star:#ffb800; --star-bg:#fff3c4; --star-edge:#e39b00;
  --no:#e5484d; --no-bg:#ffe8e8;
  --accent:#7c4dff; --accent2:#ff5fa2; --ok:#1f9d72;
  --tile-s:90%; --tile-l:88%;
  --shadow:0 6px 18px rgba(90,60,0,.08);
  --backdrop:rgba(40,20,80,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17142b; --bg2:#231e40; --card:#241f42; --ink:#f4efff; --muted:#b9b0d8; --line:#3a3362;
    --star:#ffc93c; --star-bg:#4a3c12; --star-edge:#ffb000;
    --no:#ff6b6f; --no-bg:#4a1f2a;
    --accent:#a98bff; --accent2:#ff7eb6; --ok:#43d39e;
    --tile-s:35%; --tile-l:30%;
    --shadow:0 6px 18px rgba(0,0,0,.35);
    --backdrop:rgba(8,4,20,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#17142b; --bg2:#231e40; --card:#241f42; --ink:#f4efff; --muted:#b9b0d8; --line:#3a3362;
  --star:#ffc93c; --star-bg:#4a3c12; --star-edge:#ffb000;
  --no:#ff6b6f; --no-bg:#4a1f2a;
  --accent:#a98bff; --accent2:#ff7eb6; --ok:#43d39e;
  --tile-s:35%; --tile-l:30%;
  --shadow:0 6px 18px rgba(0,0,0,.35);
  --backdrop:rgba(8,4,20,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif;line-height:1.35;
  background-image:radial-gradient(circle at 8% 0%,var(--bg2) 0,transparent 38%),radial-gradient(circle at 100% 35%,var(--bg2) 0,transparent 30%)}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
h1{font-size:clamp(21px,5.8vw,36px);margin:4px 0 2px;line-height:1.1}
h1 .name{color:var(--accent)}
.level{color:var(--muted);font-size:14px;margin-top:4px}
.level b{color:var(--ink);font-size:16px}
.hbtns{display:flex;gap:8px;flex:none}
.iconbtn{flex:none;border:0;background:var(--card);box-shadow:var(--shadow);width:46px;height:46px;border-radius:16px;font-size:21px;cursor:pointer;display:grid;place-items:center;padding:0}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-top:14px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weektitle{text-align:center}
.weektitle b{font-size:17px;display:block}
.weektitle small{color:var(--muted)}
.navbtn{border:0;background:var(--bg2);border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer;flex:none}
.navbtn:disabled{opacity:.3;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:2px 4px;font-size:13px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.day{border:2px solid transparent;background:var(--bg2);border-radius:14px;padding:6px 0;text-align:center;cursor:pointer;min-width:0}
.day .dn{font-size:12px;color:var(--muted);display:block}
.day .dd{font-size:19px;font-weight:800;display:block}
.day .ds{font-size:11px;display:block;min-height:15px;white-space:nowrap}
.day.sel{border-color:var(--accent);background:var(--card)}
.day.today .dd{color:var(--accent2)}
.day:disabled{opacity:.35;cursor:default}
.ptop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:14px}
.pstars{font-size:26px;font-weight:800}
.pmeta{color:var(--muted);font-size:14px}
.track{position:relative;height:22px;border-radius:999px;background:var(--bg2);margin-top:30px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--star),var(--accent2));transition:width .5s}
.goal{position:absolute;top:-7px;bottom:-7px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px;opacity:.55}
.goal span{position:absolute;top:-23px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;white-space:nowrap}
.mover{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:26px;transition:left .5s;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.banner{margin-top:14px;padding:12px 16px;border-radius:18px;background:linear-gradient(90deg,var(--star-bg),var(--bg2));font-weight:800;text-align:center}
.warn{margin-top:14px;padding:10px 14px;border-radius:14px;background:var(--no-bg);font-size:14px}
.dayhead h2{margin:0;font-size:21px}
.chip{background:var(--accent2);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;vertical-align:middle;margin-left:6px}
.daysum{margin-top:4px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.daysum .big{font-size:24px;font-weight:800}
.daysum .left{color:var(--muted);font-size:14px}
.tasks{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:10px;border-radius:22px;background:var(--bg);border:2px solid var(--line);transition:background .2s,border-color .2s;--pic:clamp(66px,19vw,96px)}
.task.got{border-color:var(--star);background:var(--star-bg)}
.task.miss{border-color:color-mix(in srgb,var(--no) 45%,var(--line))}
/* picture tiles */
.pic{position:relative;width:var(--pic,88px);height:var(--pic,88px);border-radius:22px;border:0;padding:0;background:hsl(var(--h,40) var(--tile-s) var(--tile-l));display:grid;place-items:center;overflow:hidden;flex:none}
button.pic{cursor:pointer}
.pic .m{font-size:calc(var(--pic,88px) * .56);line-height:1}
.pic .b{position:absolute;right:5%;bottom:3%;font-size:calc(var(--pic,88px) * .3);line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic .spk{position:absolute;left:6px;top:5px;font-size:12px;opacity:.65}
.pic .fire{position:absolute;right:4px;top:4px;font-size:12px;font-weight:800;background:var(--card);color:var(--ink);border-radius:999px;padding:0 6px;line-height:18px}
.pic.say{animation:wiggle .5s ease-in-out}
@keyframes wiggle{25%{transform:rotate(-7deg) scale(1.05)}75%{transform:rotate(7deg) scale(1.05)}}
/* 1-5 stars and crosses */
.scale{display:flex;flex-direction:column;gap:6px;min-width:0}
.row5{display:flex;gap:5px}
.sb{flex:1 1 0;min-width:0;max-width:54px;aspect-ratio:1/1;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0;cursor:pointer;display:grid;place-items:center;font-size:clamp(17px,5.2vw,28px);line-height:1;transition:transform .12s}
.sb span{filter:grayscale(1);opacity:.25;transition:filter .15s,opacity .15s}
.sb:active{transform:scale(.88)}
.sb.on span{filter:none;opacity:1}
.stars .sb.on{background:var(--star-bg);border-color:var(--star)}
.crosses .sb{border-radius:12px}
.crosses .sb.on{background:var(--no-bg);border-color:var(--no)}
.sb.pop span{animation:pop .45s ease-out both;animation-delay:calc(var(--i) * 70ms)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.cries{display:flex;align-items:center;gap:10px}
.cbtn{width:52px;height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:28px;font-weight:800;cursor:pointer;padding:0}
.cbtn:active{transform:scale(.9)}
.cval{min-width:40px;text-align:center;font-size:34px;font-weight:800}
.cmark{font-size:clamp(17px,5.2vw,26px);letter-spacing:2px;min-height:1.2em}
.tname,.cap{display:none}
body.words .tname{display:block;font-weight:800;font-size:15px}
body.words .tname small{display:block;font-weight:400;color:var(--muted);font-size:13px}
body.words .cap{display:block;font-size:13px;max-width:90px;text-align:center;line-height:1.2}
.notewrap{margin-top:14px}
.notewrap label{font-weight:800;font-size:15px}
.note{display:block;width:100%;margin-top:6px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px;min-height:58px;resize:vertical}
.reportbtn{display:block;width:100%;margin-top:16px;border:0;border-radius:20px;padding:17px;font-size:21px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:var(--shadow);cursor:pointer}
.reportbtn.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
/* overlays */
.overlay{position:fixed;inset:0;z-index:100;background:var(--backdrop);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.overlay[hidden]{display:none}
.fx{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.sheet{position:relative;z-index:2;background:var(--card);border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:520px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;padding:24px 20px 20px;text-align:center}
.sheet.settings{text-align:left;max-width:640px}
.sheet .close{position:absolute;top:12px;right:12px;width:40px;height:40px;font-size:18px}
.repweek{color:var(--muted);font-size:14px;font-weight:700}
.hero{font-size:88px;line-height:1;margin:10px 0 4px}
.hero .bounce{display:inline-block;animation:hop 1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.cryface{display:inline-block;animation:rock 2.6s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.sheet h2{margin:6px 0 6px;font-size:26px;line-height:1.15}
.sheet h3{margin:20px 0 10px;font-size:17px}
.bigstars{font-size:34px;font-weight:800;margin:4px 0 0}
.sheet .track{margin:34px 4px 6px}
.reward{margin-top:14px;padding:12px;border-radius:16px;background:var(--star-bg);font-size:17px}
.cheer{font-size:17px}
.better{margin-top:12px;font-weight:800;color:var(--ok)}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;--pic:76px}
.tile b{font-size:17px}
.moments{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.moments li{background:var(--bg);border-radius:14px;padding:9px 12px}
.moments li i{color:var(--muted);font-style:normal;font-size:13px;display:block}
.sheet .reportbtn{font-size:18px;padding:13px;margin-top:20px}
/* running stars */
.runner{position:absolute;left:0;top:0;will-change:transform;animation:run linear infinite}
@keyframes run{from{transform:translateX(-170px)}to{transform:translateX(calc(100vw + 40px))}}
.bob{animation:bob var(--step,.3s) ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-14%)}}
.runner svg{display:block;width:100%;height:auto;overflow:visible;transform:rotate(9deg)}
.runner .body{fill:var(--star);stroke:var(--star-edge);stroke-width:3;stroke-linejoin:round}
.runner .eye{fill:#3b2a00}
.runner .cheek{fill:#ff8fa3;opacity:.7}
.runner .smile{fill:none;stroke:#3b2a00;stroke-width:3;stroke-linecap:round}
.runner .leg line{stroke:#6b4a12;stroke-width:5;stroke-linecap:round}
.runner .leg ellipse{fill:var(--accent2)}
.runner .l1{transform-origin:41px 74px;animation:swing var(--step,.3s) ease-in-out infinite alternate}
.runner .l2{transform-origin:59px 74px;animation:swing var(--step,.3s) ease-in-out infinite alternate-reverse}
@keyframes swing{from{transform:rotate(32deg)}to{transform:rotate(-32deg)}}
.confetti{position:absolute;top:-24px;width:10px;height:15px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 60px)) rotate(760deg)}}
.spark{position:fixed;z-index:60;pointer-events:none;font-size:18px;transform:translate(-50%,-50%);animation:spark .75s ease-out forwards}
@keyframes spark{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4);opacity:0}}
.toast{position:fixed;left:50%;bottom:22px;z-index:200;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:18px;padding:13px 18px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .25s,transform .25s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* settings */
.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.field > span{font-weight:700;font-size:15px}
.field.check{flex-direction:row;align-items:center;gap:10px}
.small{color:var(--muted);font-size:13px;margin:4px 0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0;width:100%}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);padding:0;flex:none}
input[type=range]{padding:0;accent-color:var(--accent);border:0;background:none}
.setlist{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:10px}
.setlist li{display:grid;grid-template-columns:24px 56px minmax(0,1fr) 36px;gap:6px 8px;align-items:center;padding:10px;border-radius:16px;background:var(--bg);--pic:56px}
.setlist li.off{opacity:.55}
.setlist .full{grid-column:2/-1}
.picrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.picrow input{width:58px;text-align:center;padding:6px}
.del{border:0;background:none;font-size:18px;cursor:pointer;padding:0}
.addtask{display:grid;grid-template-columns:58px 58px minmax(0,1fr);gap:6px;padding:10px;border-radius:16px;border:2px dashed var(--line)}
.addtask input.e{text-align:center;padding:6px}
.addtask .full{grid-column:1/-1}
.btn{border:0;border-radius:12px;padding:9px 13px;font-weight:800;background:var(--bg2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:var(--no-bg);color:var(--no)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.scoretbl{font-size:13px;color:var(--muted);line-height:1.6}
@media (max-width:420px){
  .wrap{padding:12px 12px 40px}
  .card{padding:12px}
  .task{gap:9px;padding:8px}
  .row5{gap:4px}
  .sb{border-radius:11px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="name" id="name">Ihanaa</span>'s Star Chart ⭐</h1>
      <div class="level" id="level"></div>
    </div>
    <div class="hbtns">
      <button class="iconbtn" id="wordsBtn" type="button" aria-label="Show words" title="Show words (for grown-ups)">🔤</button>
      <button class="iconbtn" id="settingsBtn" type="button" aria-label="Settings" title="Settings">⚙️</button>
    </div>
  </header>

  <div class="warn" id="warn" hidden>This browser isn't saving the stars (private window?). Open the page in a normal window, or download a backup in ⚙️ Settings.</div>
  <div class="banner" id="banner" hidden></div>

  <section class="card" aria-label="Week">
    <div class="weeknav">
      <button class="navbtn" id="prevWeek" type="button" aria-label="Previous week">‹</button>
      <div class="weektitle"><b id="weekLabel"></b><small id="weekHint"></small> <button class="linkbtn" id="todayBtn" type="button" hidden>Back to today</button></div>
      <button class="navbtn" id="nextWeek" type="button" aria-label="Next week">›</button>
    </div>
    <div class="days" id="days"></div>
    <div class="ptop">
      <div class="pstars">⭐ <span id="wStars">0</span></div>
      <div class="pmeta" id="wMeta"></div>
    </div>
    <div class="track" aria-hidden="true">
      <div class="fill" id="fill" style="width:0"></div>
      <div class="goal" id="goal"><span id="goalLbl"></span></div>
      <div class="mover" id="mover">⭐</div>
    </div>
  </section>

  <section class="card" aria-label="Day">
    <div class="dayhead">
      <h2><span id="dayName"></span><span class="chip" id="todayChip" hidden>Today</span></h2>
      <div class="daysum" id="daySum"></div>
    </div>
    <ul class="tasks" id="tasks"></ul>
    <div class="notewrap">
      <label for="note">💌 A lovely moment today (optional)</label>
      <textarea class="note" id="note" maxlength="300" placeholder="She shared her crayons with her cousin…"></textarea>
    </div>
  </section>

  <button class="reportbtn" id="reportBtn" type="button">🎁 Weekly report</button>
  <footer>Tap a picture to hear the question. Stars are saved in this browser only: download a backup now and then in ⚙️ Settings.</footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="fx" id="fx"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const STORE_KEY = 'ihanaa-star-chart-v2';
// emoji = the big picture, badge = the small picture in the corner, ask = what the page says when she taps the picture.
const DEFAULT_TASKS = [
  { id:'sleep',   h:250, emoji:'😴', badge:'🌙', title:'Slept well',        hint:'Went to bed nicely and slept through the night', ask:'Did you sleep well last night?', on:true },
  { id:'rest',    h:200, emoji:'🛌', badge:'☀️', title:'Daytime rest',      hint:'Napped or rested for about 1 hour', ask:'Did you have your rest today?', on:true },
  { id:'tv',      h:15,  emoji:'📺', badge:'⏰', title:'TV time',           hint:'30 minutes at most, and switched it off herself', ask:'Did you watch TV for a short time, and switch it off yourself?', on:true },
  { id:'play',    h:48,  emoji:'🖍️', badge:'🧩', title:'Played by herself', hint:'Craft, colouring, Lego or another game', ask:'Did you play by yourself? Colouring, crafts or Lego?', on:true },
  { id:'food',    h:115, emoji:'🍽️', badge:'😋', title:'Finished her food', hint:'Ate her meal and finished on time', ask:'Did you finish your food, on time?', on:true },
  { id:'cries',   h:205, emoji:'😢', badge:'💧', title:'Crying counter',    hint:'Grown-ups tap + each time she cries. No crying = 5 stars; each cry takes 2 stars away', ask:'How many times did you cry today?', on:true, count:true },
  { id:'teeth',   h:185, emoji:'🪥', badge:'😁', title:'Brushed teeth',     hint:'Morning and bedtime', ask:'Did you brush your teeth, morning and night?', on:true },
  { id:'tidy',    h:28,  emoji:'🧸', badge:'🧺', title:'Tidied up',         hint:'Put her toys back after playing', ask:'Did you put your toys back after playing?', on:true },
  { id:'kind',    h:345, emoji:'🤗', badge:'💛', title:'Kind and helpful',  hint:'Helped, shared or said something nice', ask:'Were you kind and helpful today?', on:true },
  { id:'dress',   h:275, emoji:'👗', badge:'👟', title:'Got dressed',       hint:'Put her clothes on herself (a little help is fine)', ask:'Did you get dressed by yourself?', on:false },
  { id:'listen',  h:160, emoji:'👂', badge:'👍', title:'Listened the first time', hint:'Did it when asked, without reminders', ask:'Did you listen the first time?', on:false },
  { id:'manners', h:60,  emoji:'🙏', badge:'💬', title:'Please and thank you', hint:'Used her magic words', ask:'Did you say please and thank you?', on:false },
  { id:'brave',   h:95,  emoji:'🥦', badge:'🦁', title:'Tried something new', hint:'A new food, a new game or something brave', ask:'Did you try something new today?', on:false },
  { id:'book',    h:220, emoji:'📖', badge:'🐻', title:'Story time',        hint:'Looked at a book or listened to a story', ask:'Did you read a book or listen to a story?', on:false },
  { id:'outside', h:135, emoji:'🌳', badge:'⚽', title:'Played outside',    hint:'Fresh air and running around', ask:'Did you play outside today?', on:false },
  { id:'hands',   h:195, emoji:'🧼', badge:'👐', title:'Washed hands',      hint:'Before eating and after the toilet', ask:'Did you wash your hands before eating?', on:false },
  { id:'calm',    h:330, emoji:'😊', badge:'🌈', title:'Calm day',          hint:'Used words when upset (she rates herself)', ask:'Were you calm today? Did you use your words when you were upset?', on:false },

function closeOverlay() {
  $('#overlay').hidden = true; $('#fx').innerHTML = ''; document.body.style.overflow = '';
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
  render();
}
$('#overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay' || e.target.closest('[data-close]')) closeOverlay();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#overlay').hidden) closeOverlay(); });

/* ---------- weekly report ---------- */
function showReport() {
  const s = data.settings, name = esc(s.name), st = weekStats(weekStart), prev = weekStats(addDays(weekStart, -7));
  const we = addDays(weekStart, 6), soFar = today() < we, tasks = enabledTasks();
  const avg = t => st.per[t.id].p / st.per[t.id].rated;
  const great = tasks.filter(t => st.per[t.id].stars > 0).sort((a, b) => st.per[b.id].stars - st.per[a.id].stars).slice(0, 3);
  const weak = tasks.filter(t => st.per[t.id].rated > 0).sort((a, b) => avg(a) - avg(b));
  const happy = t => t.count && !t.photo ? Object.assign({}, t, { emoji:'😊', badge:'🌈' }) : t;
  const tile = (t, label, good) => '<div class="tile">' + picHtml(good ? happy(t) : t) + (label ? '<b>' + label + '</b>' : '') + '<span class="cap">' + esc(t.title) + '</span></div>';
  const bar = '<div class="track" aria-hidden="true"><div class="fill" style="width:' + st.pct + '%"></div>' +
    '<div class="goal" style="left:' + s.goal + '%"><span>🏁 ' + s.goal + '%</span></div>' +
    '<div class="mover" style="left:' + clamp(st.pct, 3, 97) + '%">' + (st.win ? '🌟' : '⭐') + '</div></div>' +
    '<div class="pmeta">⭐ ' + st.stars + ' · ❌ ' + st.crosses + ' · score ' + st.pct + '% (goal ' + s.goal + '%)</div>';
  const greatHtml = great.length ? '<h3>You were great at</h3><div class="tiles">' + great.map(t => tile(t, '⭐ ' + st.per[t.id].stars, true)).join('') + '</div>' : '';
  let better = '';
  if (prev.rated && st.rated) {
    if (st.stars > prev.stars) better = '<div class="better">📈 ' + (st.stars - prev.stars) + ' more stars than last week!</div>';
    else if (st.pct > prev.pct) better = '<div class="better">📈 Better than last week: ' + prev.pct + '% → ' + st.pct + '%</div>';
  }
  if (prev.cries > 0 && st.cries < prev.cries) better += '<div class="better">🌈 Fewer tears than last week: 😢 ' + prev.cries + ' → ' + st.cries + '</div>';
  const moments = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(weekStart, i), r = data.days[keyOf(d)];
    if (r && r.note) moments.push('<li><i>' + esc(fmtLong(d)) + '</i>' + esc(r.note) + '</li>');
  }
  const momentsHtml = moments.length ? '<h3>💌 Lovely moments</h3><ul class="moments">' + moments.join('') + '</ul>' : '';
  let html = '<button type="button" class="iconbtn close" data-close aria-label="Close">✕</button>' +
    '<div class="repweek">' + esc(fmtShort(weekStart)) + ' – ' + esc(fmtShort(we)) + (soFar ? ' · so far' : '') + '</div>';
  let mode = 'none';
  if (!st.rated) {
    html += '<div class="hero">🌱</div><h2>No stars yet this week</h2><p>Rate each picture during the week. The report fills up here.</p>';
  } else if (st.win) {
    mode = 'win';
    const next = weak.filter(t => avg(t) < 80)[0];
    html += '<div class="hero"><span class="bounce">🏆</span></div><h2>Superstar week, ' + name + '!</h2>' +
      '<p class="bigstars">⭐ ' + st.stars + '</p>' + bar +
      (s.reward ? '<div class="reward">🎁 Your reward: <b>' + esc(s.reward) + '</b></div>' : '') +
      better + greatHtml +
      (next ? '<h3>Next superpower 💪</h3><div class="tiles">' + tile(next) + '</div>' : '') + momentsHtml;
  } else {
    mode = 'soft';
    const steps = Math.max(1, Math.ceil((s.goal - st.p / st.rated) / 10));
    const tryMsg = steps === 1 ? 'Just <b>one more ⭐</b> on each picture next week and you reach the goal.'
      : steps === 2 ? 'Try for <b>two more ⭐</b> on each picture next week.'
      : 'A few more <b>⭐</b> every day, little by little.';
    const practise = weak.filter(t => avg(t) < 60).slice(0, 2);
    html += '<div class="hero"><span class="cryface">😢</span></div><h2>Not this time, ' + name + ', and that\'s okay!</h2>' +
      '<p class="cheer">You still collected <b>⭐ ' + st.stars + '</b> this week. 🤗</p>' + bar +
      '<p class="cheer">' + tryMsg + ' You can do it! 💪</p>' +
      better + greatHtml +
      (practise.length ? '<h3>Let\'s practise next week</h3><div class="tiles">' + practise.map(t => tile(t)).join('') + '</div>' : '') +
      momentsHtml;
  }
  html += '<button type="button" class="reportbtn" data-close>' + (mode === 'win' ? 'Yay! 🎉' : 'Close') + '</button>';
  openOverlay(html);
  if (mode === 'win') {
    runningStars($('#fx')); confetti($('#fx'), 70); sfx.win();
    setTimeout(() => sayEnglish('Superstar week, ' + s.name + '! You collected ' + st.stars + ' stars!'), 900);
  } else if (mode === 'soft') {
    sfx.soft();
    setTimeout(() => sayEnglish('Not this time, ' + s.name + ', and that is okay. You collected ' + st.stars + ' stars. You can do it next week!'), 900);
  }
}
$('#reportBtn').addEventListener('click', showReport);

/* ---------- settings ---------- */
function showSettings() {
  const s = data.settings;
  const html = '<button type="button" class="iconbtn close" data-close aria-label="Close">✕</button>' +
    '<h2>⚙️ Settings</h2>' +
    '<label class="field"><span>Child\'s name</span><input id="sName" maxlength="30" value="' + esc(s.name) + '"></label>' +
    '<label class="field"><span>Report day</span><select id="sDay">' + WEEKDAYS.map((n, i) =>
      '<option value="' + i + '"' + (i === s.reportDay ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></label>' +
    '<p class="small">The week runs up to the report day. With Friday it is Saturday to Friday.</p>' +
    '<label class="field"><span>Goal for the week: <b id="sGoalV">' + s.goal + '%</b></span>' +
    '<input type="range" id="sGoal" min="30" max="90" step="5" value="' + s.goal + '"></label>' +
    '<p class="small scoretbl">How the score works: each mark is worth ⭐⭐⭐⭐⭐ 100 · ⭐⭐⭐⭐ 90 · ⭐⭐⭐ 80 · ⭐⭐ 70 · ⭐ 60 · ' +
    '❌ 40 · ❌❌ 30 · ❌❌❌ 20 · ❌❌❌❌ 10 · ❌❌❌❌❌ 0. The week\'s score is the average of all marks. ' +
    'Pictures she has not rated do not count. The 😢 crying counter counts on every day with a mark: ' +
    'no crying ⭐⭐⭐⭐⭐ · 1 cry ⭐⭐⭐ · 2 ⭐ · 3 ❌ · 4 ❌❌❌ · 5 or more ❌❌❌❌❌.</p>' +
    '<label class="field"><span>This week\'s reward (optional, shown when she reaches the goal)</span>' +
    '<input id="sReward" maxlength="80" placeholder="Park trip, pancakes, she picks the Friday film…" value="' + esc(s.reward) + '"></label>' +
    '<label class="field check"><input type="checkbox" id="sSound"' + (s.sound ? ' checked' : '') + '><span>Happy sounds</span></label>' +
    '<label class="field check"><input type="checkbox" id="sSpeak"' + (s.speak ? ' checked' : '') + '><span>Read the question aloud when she taps a picture</span></label>' +
    '<label class="field"><span>Voice language</span><select id="sVoice">' + VOICES.map(v =>
      '<option value="' + v[0] + '"' + (v[0] === s.voice ? ' selected' : '') + '>' + v[1] + '</option>').join('') + '</select></label>' +
    '<div class="btnrow"><button type="button" class="btn" id="sTest">🔊 Test the voice</button></div>' +
    '<p class="small">For another language, also type the questions below in that language.</p>' +
    '<label class="field check"><input type="checkbox" id="sWords"' + (s.words ? ' checked' : '') + '><span>Show words under the pictures (🔤 at the top does the same)</span></label>' +
    '<h3>Pictures</h3><p class="small">Tick the ones to use. Change the big and small picture (any emoji), ' +
    'or add a 📷 photo of her own things: her bed, her toothbrush, her plate. What to say is read aloud when she taps the picture.</p>' +
    '<ul class="setlist" id="sTasks"></ul>' +
    '<div class="addtask"><input class="e" id="nEmoji" maxlength="8" value="🎹" aria-label="Big picture">' +
    '<input class="e" id="nBadge" maxlength="8" value="🎵" aria-label="Small picture">' +
    '<input id="nTitle" maxlength="40" placeholder="New task, e.g. Piano practice" aria-label="New task">' +
    '<input class="full" id="nAsk" maxlength="120" placeholder="What to say, e.g. Did you practise the piano?" aria-label="What to say">' +
    '<button type="button" class="btn primary full" id="nAdd">＋ Add picture</button></div>' +
    '<h3>Backup</h3><p class="small">The stars live in this browser only (each phone or computer has its own). ' +
    'Download a backup now and then; restore it on another device to move the stars there.</p>' +
    '<div class="btnrow"><button type="button" class="btn" id="bExport">⬇️ Download backup</button>' +
    '<label class="btn" tabindex="0">⬆️ Restore backup<input type="file" id="bImport" accept="application/json,.json" hidden></label>' +
    '<button type="button" class="btn danger" id="bReset">Start over</button></div>' +
    '<button type="button" class="reportbtn" data-close>Done</button>';
  openOverlay(html, 'settings');
  renderTaskSettings();
  $('#sName').addEventListener('input', e => { s.name = e.target.value.trim().slice(0, 30) || DEFAULTS.name; save(); renderHeader(); });
  $('#sDay').addEventListener('change', e => { s.reportDay = +e.target.value; weekStart = weekStartOf(fromKey(selKey)); save(); });
  $('#sGoal').addEventListener('input', e => { s.goal = +e.target.value; $('#sGoalV').textContent = s.goal + '%'; save(); });
  $('#sReward').addEventListener('input', e => { s.reward = e.target.value.slice(0, 80); save(); });
  $('#sSound').addEventListener('change', e => { s.sound = e.target.checked; save(); if (s.sound) sfx.stars(3); });
  $('#sSpeak').addEventListener('change', e => { s.speak = e.target.checked; save(); renderTaskSettings(); });
  $('#sVoice').addEventListener('change', e => { s.voice = e.target.value; save(); });
  $('#sTest').addEventListener('click', () => {
    const first = enabledTasks()[0];
    const was = s.speak; s.speak = true;
    say(s.voice.startsWith('en') ? 'Hello ' + s.name + '! ' + (first ? first.ask : '') : (first ? first.ask || first.title : s.name));
    s.speak = was;
  });
  $('#sWords').addEventListener('change', e => { s.words = e.target.checked; save(); renderHeader(); });
  $('#nAdd').addEventListener('click', () => {
    const title = $('#nTitle').value.trim();
    if (!title) { $('#nTitle').focus(); return; }
    s.tasks.push({ id:'c-' + Date.now().toString(36), emoji:$('#nEmoji').value.trim() || '⭐', badge:$('#nBadge').value.trim(),
      title, hint:'', ask:$('#nAsk').value.trim() || title, on:true });
    $('#nTitle').value = ''; $('#nAsk').value = '';
    save(); renderTaskSettings(); toast('Added: ' + title);
  });
  $('#bExport').addEventListener('click', exportData);
  $('#bImport').addEventListener('change', importData);
  $('#bReset').addEventListener('click', () => {
    if (!confirm('Delete all stars, notes, photos and settings in this browser? Download a backup first if you want to keep them.')) return;
    data = normalise(null); selKey = keyOf(today()); weekStart = weekStartOf(today()); save(); closeOverlay(); toast('Fresh start 🌱');
  });
}
function renderTaskSettings() {
  const ul = $('#sTasks'), s = data.settings; if (!ul) return;
  ul.innerHTML = '';
  s.tasks.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = t.on ? '' : 'off';
    li.innerHTML = '<input type="checkbox" data-f="on" aria-label="Use this picture"' + (t.on ? ' checked' : '') + '>' +
      picHtml(t) +
      '<input data-f="title" maxlength="40" aria-label="Name (for grown-ups)" value="' + esc(t.title) + '">' +
      (t.id.startsWith('c-') ? '<button type="button" class="del" data-a="del" aria-label="Delete">🗑️</button>' : '<span></span>') +
      '<div class="picrow full"><input data-f="emoji" maxlength="8" aria-label="Big picture" value="' + esc(t.emoji) + '">' +
      '<input data-f="badge" maxlength="8" aria-label="Small picture" value="' + esc(t.badge) + '">' +
      '<label class="btn">📷 Photo<input type="file" accept="image/*" data-a="photo" hidden></label>' +
      (t.photo ? '<button type="button" class="btn" data-a="nophoto">Remove photo</button>' : '') + '</div>' +
      '<input class="full" data-f="ask" maxlength="120" aria-label="What to say" placeholder="What to say when she taps it" value="' + esc(t.ask) + '">';
    li.addEventListener('input', e => {
      const f = e.target.dataset.f; if (!f || f === 'on') return;
      t[f] = e.target.value.trim();
      if (f === 'emoji' && !t.emoji) t.emoji = '⭐';
      if (f === 'title' && !t.title) t.title = 'Task';
      save();
      if (f === 'emoji' || f === 'badge') li.querySelector('.pic').outerHTML = picHtml(t);
    });
    li.addEventListener('change', e => {
      const el = e.target;
      if (el.dataset.f === 'on') { t.on = el.checked; li.className = t.on ? '' : 'off'; save(); }
      if (el.dataset.a === 'photo' && el.files && el.files[0]) addPhoto(t, el.files[0]);
    });
    li.addEventListener('click', e => {
      const a = e.target.closest('[data-a]'); if (!a) return;
      if (a.dataset.a === 'nophoto') { delete t.photo; save(); renderTaskSettings(); }
      if (a.dataset.a === 'del') {
        if (!confirm('Delete "' + t.title + '"? Its stars stop counting.')) return;
        s.tasks.splice(i, 1); save(); renderTaskSettings();
      }
    });
    ul.appendChild(li);
  });
}
function addPhoto(t, file) {
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 240, c = document.createElement('canvas'), side = Math.min(img.width, img.height);
      c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      const prev = t.photo;
      t.photo = c.toDataURL('image/jpeg', .82);
      if (!save()) { if (prev) t.photo = prev; else delete t.photo; save(); alert('That photo could not be saved: the browser storage is full.'); }
      renderTaskSettings();
    };
    img.onerror = () => alert('That file is not a picture this browser can open.');
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (data.settings.name || 'star-chart').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-stars-' + keyOf(today()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(e) {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let obj = null;
    try { obj = JSON.parse(rd.result); } catch (err) { obj = null; }
    if (!obj || typeof obj !== 'object' || !obj.days || !obj.settings) { alert('That file is not a star chart backup.'); return; }
    if (!confirm('Replace the stars in this browser with the backup (' + Object.keys(obj.days).length + ' days)?')) return;
    data = normalise(obj); weekStart = weekStartOf(fromKey(selKey)); save(); closeOverlay(); toast('Backup restored ✔');
  };
  rd.readAsText(f);
}
$('#settingsBtn').addEventListener('click', showSettings);

/* ---------- day change while the page stays open ---------- */
function checkNewDay() {
  const tk = keyOf(today());
  if (tk === todayKeySeen) { renderBanner(); return; }
  if (selKey === todayKeySeen) { selKey = tk; weekStart = weekStartOf(today()); }
  todayKeySeen = tk; render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewDay(); });
window.addEventListener('focus', checkNewDay);
setInterval(checkNewDay, 60 * 1000);

render();
// For checking the page headlessly.
window.__starChart = { get data() { return data; }, render, showReport, showSettings, weekStats: () => weekStats(weekStart),
  setDay(k) { selKey = k; weekStart = weekStartOf(fromKey(k)); render(); } };
})();
</script>
</body>
</html>
